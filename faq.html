<div class="rv mt-12 rounded-2xl border border-white/10 bg-card p-8 text-center"><p class="text-2xl">❓</p><h2 class="mt-2 text-2xl font-bold">Still have questions?</h2><p class="mt-2 text-steel">Need more information about your self drive car in Kota? Chat with our friendly team on WhatsApp or give us a quick call.</p><div class="mt-5 flex gap-3 justify-center flex-wrap"><a id="aw" class="rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 px-6 py-3 font-bold" target="_blank">Ask on WhatsApp</a><a class="rounded-xl border border-white/15 px-6 py-3 font-semibold" href="tel:+916367000635">+91 63670 00635</a></div></div></section>

<div id="ftr"></div>
<script>

document.getElementById("aw").href=`https://wa.me/${WA}?text=`+encodeURIComponent("Hello, I have a question about car rental.");
let F=[],cat="All";const list=document.getElementById("list"),tabs=document.getElementById("tabs"),qi=document.getElementById("q");
const draw=()=>{const q=qi.value.toLowerCase();const r=F.filter(f=>(cat==="All"||f.category===cat)&&(!q||(f.question+f.answer).toLowerCase().includes(q)));
list.innerHTML=r.length?r.map((f,i)=>`<details class="rounded-xl border border-white/10 bg-card p-5" ${i===0&&!q&&cat==="All"?"open":""}><summary class="flex justify-between items-center gap-4 font-semibold text-lg">${esc(f.question)}<span class="plus text-2xl text-gold">+</span></summary><div class="mt-3 text-steel">${esc(f.answer)}</div></details>`).join(""):'<p class="text-steel">No questions found.</p>'};
const tabsDraw=()=>{const c=["All",...new Set(F.map(f=>f.category).filter(Boolean))];tabs.innerHTML=c.map(x=>`<button type="button" data-c="${esc(x)}" class="tab ${x===cat?"on":""} rounded-lg px-4 py-2 text-sm font-semibold text-steel">${esc(x)}</button>`).join("")};
tabs.onclick=e=>{const b=e.target.closest("[data-c]");if(b){cat=b.dataset.c;tabsDraw();draw()}};qi.oninput=draw;
api("/api/faqs").then(d=>{F=d.faqs||[];if(!F.length){list.innerHTML='<p class="text-steel">FAQs will appear here soon. Meanwhile, message us on WhatsApp.</p>';return}
tabsDraw();draw();seo({title:document.title,desc:document.querySelector('meta[name=description]').content,url:location.href.split("?")[0],ld:{"@context":"https://schema.org","@type":"FAQPage",mainEntity:F.map(f=>({"@type":"Question",name:f.question,acceptedAnswer:{"@type":"Answer",text:f.answer}}))}})}).catch(e=>{console.error(e);list.innerHTML='<p class="text-red-400">Unable to load FAQs ('+esc(e.message)+'). Please try again later.</p>'});
reveal();
</script>
