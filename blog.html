<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Blog & Guides | Car Rental Tips for Kota & Rajasthan</title>
<meta name="description" content="Read travel guides, car rental tips and fleet highlights from Vishal Car Rental & Tour and Travels, Kota.">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="https://www.YOURDOMAIN.in/blog">
<meta property="og:type" content="website"><meta property="og:title" content="Travel Blog & Guides | Car Rental Tips for Kota & Rajasthan"><meta property="og:description" content="Read travel guides, car rental tips and fleet highlights from Vishal Car Rental & Tour and Travels, Kota."><meta property="og:url" content="https://www.YOURDOMAIN.in/blog">
<meta name="theme-color" content="#0B0714">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237C3AED'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='%23FFFFFF' font-family='Arial' font-weight='800'>V</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script>document.write('<script src="'+(location.protocol==="file:"?"":"/")+'site.js"><\/script>')</script>
</head>
<body data-page="blog" class="bg-navy text-white antialiased">
<div id="hdr"></div>
<main>
<script>document.write(H("NEWS & INSIGHTS","Travel Guides, Tips & Fleet Highlights","Practical advice for renting a car, driving in Rajasthan and planning your trip from Kota."))</script>
<section class="max-w-7xl mx-auto px-6 pb-16"><div id="tabs" class="flex flex-wrap gap-1 rounded-xl border border-white/10 bg-card p-1.5 w-fit mb-8"></div>
<div id="grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"><div class="sk h-80 rounded-2xl"></div><div class="sk h-80 rounded-2xl"></div><div class="sk h-80 rounded-2xl"></div></div></section>
</main>
<div id="ftr"></div>
<script>

let B=[],cat="All";const grid=document.getElementById("grid"),tabs=document.getElementById("tabs");
const draw=()=>{const r=B.filter(b=>cat==="All"||b.category===cat);grid.innerHTML=r.map(b=>`<article class="rv on card flex flex-col overflow-hidden rounded-2xl border border-white/10 bg-card"><a href="${L("/blog/"+b.slug)}" class="relative block h-48 bg-gradient-to-br from-violet-700/60 to-[#1B1233]">${b.image_url?`<img src="${esc(b.image_url)}" alt="${esc(b.title)}" loading="lazy" class="w-full h-full object-cover">`:""}<span class="absolute left-3 top-3 rounded-full bg-navy/80 px-3 py-1 text-xs font-semibold">${esc(b.category||"Article")}</span></a><div class="flex-1 p-6"><p class="text-xs text-steel">${fmtDate(b.created_at)} · ${b.read_minutes||4} min read</p><h2 class="mt-2 text-xl font-bold"><a href="${L("/blog/"+b.slug)}" class="hover:text-gold">${esc(b.title)}</a></h2><p class="mt-2 text-sm text-steel line-clamp-3">${esc(b.excerpt)}</p></div><a href="${L("/blog/"+b.slug)}" class="border-t border-white/10 px-6 py-4 text-sm font-semibold text-gold">Read Full Article →</a></article>`).join("")};
api("/api/blogs").then(d=>{B=d.blogs||[];if(!B.length){grid.innerHTML='<p class="text-steel">No articles yet. Please check back soon.</p>';return}
const c=["All",...new Set(B.map(b=>b.category).filter(Boolean))];const t=()=>tabs.innerHTML=c.map(x=>`<button type="button" data-c="${esc(x)}" class="tab ${x===cat?"on":""} rounded-lg px-4 py-2 text-sm font-semibold text-steel">${esc(x)}</button>`).join("");t();
tabs.onclick=e=>{const b=e.target.closest("[data-c]");if(b){cat=b.dataset.c;t();draw()}};draw()}).catch(()=>grid.innerHTML='<p class="text-red-400">Unable to load articles. Please try again later.</p>');
</script>
</body>
</html>
