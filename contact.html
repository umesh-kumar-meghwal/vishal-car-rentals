<body data-page="contact" class="bg-navy text-white antialiased">

<div id="hdr"></div>
<main>
<script>document.write(H("CONTACT US","Get in Touch With Our Team","We are here to assist with car reservations, custom outstation quotes and all self-drive enquiries across Rajasthan."))</script>
<section class="max-w-6xl mx-auto px-5 sm:px-6 pb-14 grid grid-cols-1 lg:grid-cols-2 gap-8">
<div class="min-w-0 space-y-6"><div class="rv rounded-2xl border border-white/10 bg-card p-5 sm:p-6 space-y-5">
<div class="flex gap-4"><span id="i1" class="grid place-items-center shrink-0 w-12 h-12 rounded-xl bg-violet-600/20 border border-violet-500/40 text-gold"></span><div class="min-w-0"><p class="font-display font-bold">Our location</p><p class="mt-1 text-slate-300">232, Sector 7, Keshavpura, Mahaveer Nagar, Kota, Rajasthan 324005</p></div></div>
<div class="flex gap-4 border-t border-white/10 pt-5"><span id="i2" class="grid place-items-center shrink-0 w-12 h-12 rounded-xl bg-violet-600/20 border border-violet-500/40 text-gold"></span><div class="min-w-0"><p class="font-display font-bold">Phone and WhatsApp</p><a class="mt-1 inline-block font-display text-lg font-bold text-gold" href="tel:+916367000635">+91 63670 00635</a></div></div>
<div class="flex gap-4 border-t border-white/10 pt-5"><span id="i3" class="grid place-items-center shrink-0 w-12 h-12 rounded-xl bg-violet-600/20 border border-violet-500/40 text-gold"></span><div class="min-w-0"><p class="font-display font-bold">Availability</p><p class="mt-1 text-slate-300">Bookings and support, 24/7</p></div></div></div>
<iframe title="Vishal Car Rental map, Keshavpura Kota" loading="lazy" class="rv w-full h-64 sm:h-72 rounded-2xl border-0" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4459.756101820234!2d75.83287757918603!3d25.14001516571837!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x396f8563526e7783%3A0x263cf9814b83cbb!2sVishal%20Car%20Rental%20and%20Tour%20and%20Travel!5e1!3m2!1sen!2sin!4v1793179288379!5m2!1sen!2sin"></iframe></div>
<form id="cf" class="rv min-w-0 rounded-2xl border border-white/10 bg-card p-5 sm:p-6 md:p-8 space-y-4"><h2 class="text-2xl font-bold">Send us a message</h2><p class="text-sm text-steel">Fill out your details below and our team will get back to you immediately.</p>
<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;height:0;width:0;opacity:0">
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><label class="text-sm font-medium">First name *<input class="inp mt-1" name="first_name" required maxlength="40" placeholder="First name"></label><label class="text-sm font-medium">Last name *<input class="inp mt-1" name="last_name" required maxlength="40" placeholder="Last name"></label>
<label class="text-sm font-medium">Email address *<input class="inp mt-1" type="email" name="email" required placeholder="name@example.com"></label><label class="text-sm font-medium">Phone number *<input class="inp mt-1" type="tel" name="phone" required pattern="[0-9+ ()\-]{8,18}" placeholder="+91 00000 00000"></label></div>
<label class="block text-sm font-medium">Message *<textarea class="inp mt-1 min-h-[130px]" name="message" required minlength="10" maxlength="1000" placeholder="Describe your travel plan, dates or questions..."></textarea></label>
<button type="submit" class="w-full flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 py-3.5 font-bold hover:brightness-110 transition disabled:opacity-60"><svg class="w-5 h-5"><use href="#chat"/></svg>Send message on WhatsApp</button><p class="st text-sm" role="status"></p></form></section>
</main>
<div id="ftr"></div>
<script>
const ICONS={pin:'<path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const ic=(n,c="w-6 h-6")=>`<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
["pin","phone","clock"].forEach((n,i)=>document.getElementById("i"+(i+1)).innerHTML=ic(n));

/* WhatsApp window pehle hi khol lete hain, taaki phone ka popup blocker na roke */
document.getElementById("cf").onsubmit=async e=>{e.preventDefault();
  const f=e.target,d=Object.fromEntries(new FormData(f)),b=f.querySelector("button[type=submit]"),st=f.querySelector(".st");
  const w=window.open("about:blank","_blank");
  b.disabled=true;st.className="st text-sm text-steel";st.textContent="Sending…";
  try{
    await post("/api/contact",d);
    const u=`https://wa.me/${WA}?text=`+encodeURIComponent(`Hello Vishal Car Rental,\nName: ${d.first_name} ${d.last_name}\nPhone: ${d.phone}\n${d.message}`);
    if(w)w.location.href=u;else location.href=u;
    f.reset();st.className="st text-sm text-emerald-400";st.textContent="Message received! Opening WhatsApp…";
  }catch(err){
    if(w)w.close();
    st.className="st text-sm text-red-400";st.textContent=err.message||"Something went wrong. Please try again.";
  }
  b.disabled=false};
reveal();
</script>
</body>
